[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qudpy-fdgf"
dynamic = ["version"]
description = "Computing ultrafast nonlinear optical responses using frequency-domain Green's functions"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Needed by the example notebooks: QuTiP builds the physical operators,
# while ufss.DiagramGenerator generates the fifth-order pathways.
examples = ["ufss", "ipython", "qutip"]
# Only the qudpy_fdgf.experimental tensor-network modules import tenpy.
manybody = ["physics-tenpy"]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/SilvaScience/QuDPy-FDGF"

[tool.setuptools.dynamic]
version = { attr = "qudpy_fdgf.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# testpaths points into local/, which is git-ignored; move the suite back to
# tests/ at the repository root to make it part of the published package.
testpaths = ["local/tests"]
